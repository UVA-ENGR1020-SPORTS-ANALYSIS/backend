name: Keep Render Backend Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend warmup endpoint
        env:
          HEALTHCHECK_URL: ${{ secrets.RENDER_HEALTHCHECK_URL }}
          WARMUP_KEY: ${{ secrets.RENDER_WARMUP_KEY }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "RENDER_HEALTHCHECK_URL is not set."
            exit 1
          fi

          if [ -z "$WARMUP_KEY" ]; then
            echo "RENDER_WARMUP_KEY is not set."
            exit 1
          fi

          curl --fail --silent --show-error --max-time 20 \
            -H "x-warmup-key: $WARMUP_KEY" \
            "$HEALTHCHECK_URL"
